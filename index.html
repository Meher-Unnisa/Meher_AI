<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Personal AI</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#080808;color:#fff;height:100vh;display:flex;flex-direction:column}
/* LOCK SCREEN */
#lock{position:fixed;inset:0;background:#080808;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px}
#lock h2{font-size:20px} #lock input{padding:12px 18px;border-radius:20px;border:1px solid #333;background:#1a1a1a;color:#fff;text-align:center;letter-spacing:8px;font-size:20px;width:160px;outline:none}
#lock button{padding:10px 25px;border-radius:20px;border:none;background:#fff;color:#000;font-weight:700}
.top{padding:9px;background:#151515;text-align:center;border-bottom:1px solid #222}
#status{font-size:11px;color:#2aff7f}
.chat{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:87%;padding:9px 11px;border-radius:13px;font-size:13px;white-space:pre-wrap}
.user{align-self:flex-end;background:#2a7fff}.bot{align-self:flex-start;background:#1f1f1f;border:1px solid #2a2a2a}
.controls{display:flex;gap:4px;padding:7px;background:#151515;border-top:1px solid #222;align-items:center}
.controls input{flex:1;padding:10px;border-radius:18px;border:none;background:#262626;color:#fff;outline:none}
.icon{width:38px;height:38px;border-radius:50%;border:none;background:#262626;color:#fff}
video{width:100%;max-height:160px;display:none;border-radius:8px}
</style>
</head>
<body>

<div id="lock">
<h2>🔒 Personal AI Locked</h2>
<p style="font-size:12px;color:#888" id="lockMsg">4-digit PIN set karo (pehli baar)</p>
<input id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
<button onclick="checkPin()">Unlock</button>
<button onclick="resetPin()" style="background:transparent;color:#555;font-size:11px;margin-top:10px">PIN bhul gaye? Reset</button>
</div>

<div class="top"><b>🔐 Secure AI - Only You</b><span id="status">Loading 80MB...</span></div>
<video id="vid" autoplay playsinline></video>
<canvas id="can" style="display:none"></canvas>
<div class="chat" id="chat"></div>
<div class="controls">
<input type="file" id="fileIn" accept=".pdf,.png,.jpg,.jpeg,.txt" hidden onchange="handleFile(this.files[0])">
<button class="icon" onclick="document.getElementById('fileIn').click()">📁</button>
<button class="icon" onclick="openCam()">📷</button>
<button id="mic" class="icon" onclick="startVoice()">🎤</button>
<input id="inp" disabled placeholder="Loading..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()" style="background:#fff;color:#000;border:none;border-radius:16px;padding:0 12px;height:38px;font-weight:700">Send</button>
</div>

<script type="module">
import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm@0.2.79";

// --- PIN LOCK LOGIC ---
const lockDiv=document.getElementById('lock'), pinInput=document.getElementById('pinInput'), lockMsg=document.getElementById('lockMsg');
let savedPin=localStorage.getItem('my_ai_pin');
if(savedPin){ lockMsg.innerText="Apna 4-digit PIN dalo"; }
window.checkPin=()=>{
  let p=pinInput.value.trim();
  if(p.length!==4){ alert("4 digit dalo"); return; }
  if(!savedPin){ localStorage.setItem('my_ai_pin',p); savedPin=p; unlock(); }
  else if(p===savedPin){ unlock(); }
  else{ alert("Galat PIN!"); pinInput.value=""; }
}
window.resetPin=()=>{ if(confirm("Saara PIN delete ho jayega. Continue?")){localStorage.removeItem('my_ai_pin'); location.reload();}}
function unlock(){ lockDiv.style.display='none'; init(); }
if(!savedPin){ /* first time wait for set */ } else { pinInput.focus(); }

// --- AI LOGIC ---
const SYSTEM_PROMPT = `You are secure personal AI for Housewife+Mother+IT placement. User data is private. Never share. Mode: Exam (MCQ/notes), File (read PDF/image), Personal supportive Hinglish.`;

let engine, messages=[{role:"system",content:SYSTEM_PROMPT}];
const chatDiv=document.getElementById('chat'), inp=document.getElementById('inp'), status=document.getElementById('status');
const vid=document.getElementById('vid'), can=document.getElementById('can');

async function init(){
  engine=await CreateMLCEngine("SmolLM2-135M-Instruct-q4f16_1-MLC",{initProgressCallback:p=>status.innerText=`Loading ${Math.round(p.progress*100)}%`});
  status.innerText="✅ Secure & Ready - Offline"; inp.disabled=false; inp.placeholder="Secure chat...";
  add("🔓 Unlocked! Ab sab kuch private hai. File bhejo ya sawal pucho ❤️",'bot');
}
function add(t,c){let d=document.createElement('div');d.className='msg '+c;d.innerText=t;chatDiv.appendChild(d);chatDiv.scrollTop=chatDiv.scrollHeight;return d;}
window.send=async()=>{
  let text=inp.value.trim(); if(!text) return; add(text,'user'); inp.value=''; messages.push({role:"user",content:text});
  let bot=add("...",'bot'); let full=""; const s=await engine.chat.completions.create({messages,stream:true});
  for await(const ch of s){let d=ch.choices[0]?.delta?.content||""; full+=d; bot.innerText=full; chatDiv.scrollTop=chatDiv.scrollHeight;}
  messages.push({role:"assistant",content:full});
}
window.handleFile=async(file)=>{
  if(!file) return; add(`📎 ${file.name} uploaded`,'user'); status.innerText=`📖 ${file.name} reading...`; let text="";
  if(file.type.includes("pdf")){
    const pdf=await pdfjsLib.getDocument(URL.createObjectURL(file)).promise;
    for(let i=1;i<=Math.min(pdf.numPages,5);i++){let p=await pdf.getPage(i); let c=await p.getTextContent(); text+=c.items.map(x=>x.str).join(" ")+" ";}
  }else if(file.type.includes("image")){
    const {data}=await Tesseract.recognize(file,'eng+hin'); text=data.text;
  }else{ text=await file.text(); }
  status.innerText="✅ Ready"; inp.value=`[FILE ${file.name}] ${text.slice(0,4000)} - Iska summary + MCQ banao`; send();
}
window.openCam=async()=>{
  vid.style.display='block'; let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}); vid.srcObject=stream;
  window.openCam=async()=>{can.width=vid.videoWidth; can.height=vid.videoHeight; can.getContext('2d').drawImage(vid,0,0); vid.style.display='none'; stream.getTracks().forEach(t=>t.stop()); handleFile(await (await fetch(can.toDataURL())).blob());}
}
window.startVoice=()=>{
  let rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)(); rec.lang='hi-IN'; rec.start();
  document.getElementById('mic').style.background='red'; rec.onresult=e=>{inp.value=e.results[0][0].transcript; send();}
  rec.onend=()=>document.getElementById('mic').style.background='#262626';
}
</script>
</body>
</html>
