<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Personal AI - Meher</title>
<script type="importmap">
{ "imports": { "@mlc-ai/web-llm": "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm" } }
</script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui}
body{background:radial-gradient(circle at top, #1a1a2e 0%, #080808 60%);color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* LOCK SCREEN - Premium */
#lock{position:fixed;inset:0;background:radial-gradient(circle at center, #1a1a2e, #000);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.lock-card{background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);padding:30px 25px;border-radius:25px;display:flex;flex-direction:column;align-items:center;gap:15px;box-shadow:0 20px 50px rgba(0,0,0,0.5)}
#lock h2{font-size:22px;letter-spacing:1px}
#lock input{padding:14px 20px;border-radius:30px;border:1px solid #333;background:#111;color:#fff;text-align:center;letter-spacing:10px;font-size:22px;width:180px;outline:none;box-shadow:inset 0 2px 10px rgba(0,0,0,0.5)}
#lock button.unlock-btn{padding:12px 35px;border-radius:30px;border:none;background:linear-gradient(135deg,#fff,#bbb);color:#000;font-weight:800;font-size:14px;cursor:pointer;transition:0.2s}
.unlock-btn:active{transform:scale(0.95)}

.top{padding:12px;background:rgba(255,255,255,0.04);backdrop-filter:blur(10px);text-align:center;border-bottom:1px solid rgba(255,255,255,0.08);position:sticky;top:0}
.top b{font-size:14px;letter-spacing:0.5px}
#status{font-size:11px;color:#2aff7f;display:block;margin-top:4px;letter-spacing:0.5px}

.chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.msg{max-width:85%;padding:12px 14px;border-radius:18px;font-size:13.5px;white-space:pre-wrap;line-height:1.5;animation:pop 0.2s ease}
@keyframes pop{from{transform:scale(0.9);opacity:0}to{transform:scale(1);opacity:1}}
.user{align-self:flex-end;background:linear-gradient(135deg,#3a7bff,#2a5ee8);color:#fff;border-bottom-right-radius:5px;box-shadow:0 5px 15px rgba(42,126,255,0.3)}
.bot{align-self:flex-start;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-bottom-left-radius:5px}

/* CONTROLS - Very Attractive */
.controls{display:flex;gap:8px;padding:12px 10px;background:rgba(20,20,20,0.8);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.08);align-items:flex-end}

.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.08);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.2s;flex-shrink:0}
.icon-btn:hover{background:rgba(255,255,255,0.15);transform:translateY(-2px);box-shadow:0 5px 15px rgba(0,0,0,0.3)}
.icon-btn:active{transform:scale(0.92)}
#mic.recording{background:linear-gradient(135deg,#ff2a2a,#ff5e5e)!important;animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,42,42,0.7)}70%{box-shadow:0 0 0 10px rgba(255,42,42,0)}100%{box-shadow:0 0 0 0 rgba(255,42,42,0)}}

.input-wrap{flex:1;position:relative;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:28px;display:flex;align-items:center;padding:5px 6px 5px 18px;transition:0.2s}
.input-wrap:focus-within{border-color:#3a7bff;box-shadow:0 0 0 3px rgba(58,123,255,0.15);background:rgba(255,255,255,0.12)}
.input-wrap input{flex:1;background:transparent;border:none;color:#fff;outline:none;font-size:15px;padding:10px 5px;min-height:24px}
.input-wrap input::placeholder{color:#888}

.send-btn{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,#fff,#e0e0e0);color:#000;font-size:18px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.2s;box-shadow:0 5px 15px rgba(255,255,255,0.2)}
.send-btn:hover{transform:translateY(-2px) scale(1.05)}
.send-btn:active{transform:scale(0.9)}

video{width:95%;max-height:180px;display:none;border-radius:15px;margin:10px auto;border:2px solid #333}
</style>
</head>
<body>

<div id="lock">
  <div class="lock-card">
    <div style="font-size:40px">🔒</div>
    <h2>Personal AI Locked</h2>
    <p style="font-size:12px;color:#888" id="lockMsg">4-digit PIN set karo (pehli baar)</p>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
    <button class="unlock-btn" onclick="checkPin()">UNLOCK ✨</button>
    <button onclick="resetPin()" style="background:transparent;color:#555;font-size:11px;border:none;margin-top:5px;cursor:pointer">PIN bhul gaye? Reset</button>
  </div>
</div>

<div class="top"><b>🔐 Secure AI - Only You</b><span id="status">PIN dalo to start...</span></div>
<video id="vid" autoplay playsinline></video>
<canvas id="can" style="display:none"></canvas>
<div class="chat" id="chat"></div>

<div class="controls">
  <input type="file" id="fileIn" accept=".pdf,.png,.jpg,.jpeg,.txt" hidden>
  <button class="icon-btn" id="fileBtn" title="File"><i class="fa-solid fa-paperclip"></i></button>
  <button class="icon-btn" id="camBtn" title="Camera"><i class="fa-solid fa-camera"></i></button>

  <div class="input-wrap">
    <input id="inp" disabled placeholder="Type your secret message...">
    <button class="send-btn" id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
  </div>

  <button id="mic" class="icon-btn" title="Voice"><i class="fa-solid fa-microphone"></i></button>
</div>

<script type="module">
import { CreateMLCEngine } from "@mlc-ai/web-llm";

// --- PIN LOGIC - SAME AS BEFORE ---
const lockDiv=document.getElementById('lock'), pinInput=document.getElementById('pinInput'), lockMsg=document.getElementById('lockMsg');
let savedPin=localStorage.getItem('my_ai_pin');
if(savedPin){ lockMsg.innerText="Apna 4-digit PIN dalo"; }
window.checkPin=()=>{
  let p=pinInput.value.trim();
  if(p.length!==4){ alert("4 digit dalo"); return; }
  if(!savedPin){ localStorage.setItem('my_ai_pin',p); savedPin=p; unlock(); }
  else if(p===savedPin){ unlock(); }
  else{ alert("Galat PIN!"); pinInput.value=""; }
}
window.resetPin=()=>{ if(confirm("Saara PIN delete ho jayega. Continue?")){localStorage.removeItem('my_ai_pin'); location.reload();}}
function unlock(){ lockDiv.style.display='none'; init(); }

// --- AI LOGIC - SAME, NO CHANGE ---
const SYSTEM_PROMPT = `You are secure personal AI for Housewife+Mother+IT placement. User data is private. Never share. Mode: Exam (MCQ/notes), File (read PDF/image), Personal supportive Hinglish.`;
let engine, messages=[{role:"system",content:SYSTEM_PROMPT}];
const chatDiv=document.getElementById('chat'), inp=document.getElementById('inp'), status=document.getElementById('status');
const vid=document.getElementById('vid'), can=document.getElementById('can');

async function init(){
  try{
    status.innerText="⏳ 80MB Model Loading... 1-2 min";
    engine=await CreateMLCEngine("SmolLM2-135M-Instruct-q4f16_1-MLC",{initProgressCallback:p=>status.innerText=`Loading ${Math.round(p.progress*100)}%`});
    status.innerText="✅ Secure & Ready - 100% Offline"; inp.disabled=false; inp.placeholder="Type your secret message... ✨";
    add("🔓 Unlocked! Ab sab kuch private hai. File bhejo ya sawal pucho ❤️",'bot');
  }catch(e){ status.innerText="❌ Error: "+e.message }
}
function add(t,c){let d=document.createElement('div');d.className='msg '+c;d.innerText=t;chatDiv.appendChild(d);chatDiv.scrollTop=chatDiv.scrollHeight;return d;}

async function sendMsg(){
  let text=inp.value.trim(); if(!text) return; add(text,'user'); inp.value=''; messages.push({role:"user",content:text});
  let bot=add("...",'bot'); let full="";
  try{
    const s=await engine.chat.completions.create({messages,stream:true});
    for await(const ch of s){let d=ch.choices[0]?.delta?.content||""; full+=d; bot.innerText=full; chatDiv.scrollTop=chatDiv.scrollHeight;}
    messages.push({role:"assistant",content:full});
  }catch(e){ bot.innerText="Error: "+e.message }
}

// Button Listeners - LOGIC SAME
document.getElementById('sendBtn').onclick=sendMsg;
inp.onkeypress=e=>{if(e.key==='Enter')sendMsg()};
document.getElementById('fileBtn').onclick=()=>document.getElementById('fileIn').click();
document.getElementById('fileIn').onchange=e=>handleFile(e.target.files[0]);

async function handleFile(file){
  if(!file) return; add(`📎 ${file.name} uploaded`,'user'); status.innerText=`📖 ${file.name} reading...`; let text="";
  try{
    if(file.type.includes("pdf")){
      const pdf=await pdfjsLib.getDocument(URL.createObjectURL(file)).promise;
      for(let i=1;i<=Math.min(pdf.numPages,5);i++){let p=await pdf.getPage(i); let c=await p.getTextContent(); text+=c.items.map(x=>x.str).join(" ")+" ";}
    }else if(file.type.includes("image")){
      const {data}=await Tesseract.recognize(file,'eng+hin'); text=data.text;
    }else{ text=await file.text(); }
    status.innerText="✅ Ready"; inp.value=`[FILE ${file.name}] ${text.slice(0,4000)} - Iska summary + MCQ banao`; sendMsg();
  }catch(e){ status.innerText="File error: "+e.message }
}

document.getElementById('camBtn').onclick=async()=>{
  if(vid.style.display==='none' ||!vid.style.display){
    vid.style.display='block'; let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}); vid.srcObject=stream; vid._stream=stream;
  }else{
    can.width=vid.videoWidth; can.height=vid.videoHeight; can.getContext('2d').drawImage(vid,0,0); vid.style.display='none'; vid._stream.getTracks().forEach(t=>t.stop());
    let blob=await (await fetch(can.toDataURL())).blob(); handleFile(new File([blob],"camera.jpg",{type:"image/jpeg"}));
  }
}
document.getElementById('mic').onclick=()=>{
  let rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)(); rec.lang='hi-IN'; rec.start();
  let micBtn=document.getElementById('mic'); micBtn.classList.add('recording');
  rec.onresult=e=>{inp.value=e.results[0][0].transcript; sendMsg();}
  rec.onend=()=>micBtn.classList.remove('recording');
}
</script>
</body>
</html></script>
</body>
</html>
