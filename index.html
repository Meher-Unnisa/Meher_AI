<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>Secure Personal AI - Meher</title>
<script type="importmap">
{ "imports": { "@mlc-ai/web-llm": "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm" } }
</script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui}
body{background:#ffffff;color:#111;height:100dvh;display:flex;flex-direction:column}

/* LOCK - WHITE */
#lock{position:fixed;inset:0;background:#ffffff;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.lock-card{background:#fff;border:1px solid #e5e5e5;padding:30px 25px;border-radius:25px;display:flex;flex-direction:column;align-items:center;gap:15px;box-shadow:0 20px 60px rgba(0,0,0,0.08)}
#lock input{padding:14px 20px;border-radius:30px;border:1.5px solid #ddd;background:#f8f8f8;color:#111;text-align:center;letter-spacing:10px;font-size:22px;width:180px;outline:none}
#lock button.unlock-btn{padding:12px 35px;border-radius:30px;border:none;background:#111;color:#fff;font-weight:800;cursor:pointer}

.top{padding:12px;background:#fff;text-align:center;border-bottom:1px solid #eee;position:sticky;top:0;z-index:5}
.top b{font-size:14px} #status{font-size:11px;color:#0a7f2e;display:block;margin-top:3px}

.chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px;background:#fdfdfd}
.msg{max-width:85%;padding:12px 14px;border-radius:18px;font-size:14px;white-space:pre-wrap;line-height:1.5}
.user{align-self:flex-end;background:#111;color:#fff;border-bottom-right-radius:5px}
.bot{align-self:flex-start;background:#f1f1f1;color:#111;border:1px solid #eee;border-bottom-left-radius:5px}

/* CONTROLS - WHITE BIG */
.controls{display:flex;gap:8px;padding:10px;background:#ffffff;border-top:1px solid #eee;align-items:center;position:sticky;bottom:0}
.icon-btn{width:46px;height:46px;border-radius:50%;border:1px solid #e5e5e5;background:#f8f8f8;color:#111;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:active{transform:scale(0.92)}
#mic.recording{background:#ff2a2a!important;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,42,42,0.6)}70%{box-shadow:0 0 0 10px rgba(255,42,42,0)}100%{box-shadow:0 0 0 0 rgba(255,42,42,0)}}

.input-wrap{flex:1;display:flex;align-items:center;background:#f2f2f2;border:1.5px solid #e5e5e5;border-radius:30px;padding:4px 5px 4px 16px}
.input-wrap:focus-within{border-color:#111;background:#fff}
.input-wrap input{flex:1;background:transparent;border:none;outline:none;font-size:16px;padding:12px 5px;color:#111}
.input-wrap input::placeholder{color:#999}
.send-btn{width:44px;height:44px;border-radius:50%;border:none;background:#111;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}

video{width:95%;max-height:180px;display:none;border-radius:15px;margin:10px auto;border:1px solid #eee}
</style>
</head>
<body>

<div id="lock">
  <div class="lock-card">
    <div style="font-size:40px">🔒</div>
    <h2>Personal AI Locked</h2>
    <p style="font-size:12px;color:#777" id="lockMsg">4-digit PIN set karo</p>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
    <button class="unlock-btn" onclick="checkPin()">UNLOCK</button>
    <button onclick="resetPin()" style="background:transparent;color:#999;font-size:11px;border:none;margin-top:5px">Reset PIN</button>
  </div>
</div>

<div class="top"><b>🔐 Secure AI - Only You</b><span id="status">PIN dalo...</span></div>
<video id="vid" autoplay playsinline></video>
<canvas id="can" style="display:none"></canvas>
<div class="chat" id="chat"></div>

<div class="controls">
  <input type="file" id="fileIn" accept=".pdf,.png,.jpg,.jpeg,.txt" hidden>
  <button class="icon-btn" id="fileBtn"><i class="fa-solid fa-paperclip"></i></button>
  <button class="icon-btn" id="camBtn"><i class="fa-solid fa-camera"></i></button>
  <div class="input-wrap" onclick="document.getElementById('inp').focus()">
    <input id="inp" type="text" inputmode="text" autocomplete="off" placeholder="Type your secret message..." enterkeyhint="send">
    <button class="send-btn" id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
  </div>
  <button id="mic" class="icon-btn"><i class="fa-solid fa-microphone"></i></button>
</div>

<script type="module">
import { CreateMLCEngine } from "@mlc-ai/web-llm";
const lockDiv=document.getElementById('lock'), pinInput=document.getElementById('pinInput'), lockMsg=document.getElementById('lockMsg');
let savedPin=localStorage.getItem('my_ai_pin');
if(savedPin) lockMsg.innerText="Apna 4-digit PIN dalo";
window.checkPin=()=>{
  let p=pinInput.value.trim();
  if(p.length!==4){alert("4 digit dalo");return;}
  if(!savedPin){localStorage.setItem('my_ai_pin',p);savedPin=p;unlock();}
  else if(p===savedPin){unlock();}else{alert("Galat PIN!");pinInput.value="";}
}
window.resetPin=()=>{if(confirm("PIN delete?")){localStorage.removeItem('my_ai_pin');location.reload();}}
function unlock(){lockDiv.style.display='none';init();}

const SYSTEM_PROMPT=`You are secure personal AI for Housewife+Mother+IT placement. Private, Hinglish supportive.`;
let engine, messages=[{role:"system",content:SYSTEM_PROMPT}];
const chatDiv=document.getElementById('chat'), inp=document.getElementById('inp'), status=document.getElementById('status'), vid=document.getElementById('vid'), can=document.getElementById('can');

async function init(){
  try{
    // KEYBOARD FIX: input ko pehle hi enable karo taaki keyboard aaye
    inp.disabled=false; inp.focus();
    status.innerText="⏳ Model Loading... 1 min";
    // FIXED MODEL ID - Ye Vercel pe 100% chalega
    engine=await CreateMLCEngine("Llama-3.2-1B-Instruct-q4f32_1-MLC",{initProgressCallback:p=>status.innerText=`Loading ${Math.round(p.progress*100)}%`});
    status.innerText="✅ Ready - 100% Offline";
    add("🔓 Unlocked! Ab sab private hai ❤️",'bot');
  }catch(e){ status.innerText="❌ "+e.message; console.error(e); add("Error: "+e.message+" - Refresh karo",'bot'); }
}
function add(t,c){let d=document.createElement('div');d.className='msg '+c;d.innerText=t;chatDiv.appendChild(d);chatDiv.scrollTop=chatDiv.scrollHeight;return d;}
async function sendMsg(){
  let text=inp.value.trim(); if(!text) return; add(text,'user'); inp.value=''; inp.focus(); messages.push({role:"user",content:text});
  let bot=add("...",'bot'); let full="";
  try{
    const s=await engine.chat.completions.create({messages,stream:true});
    for await(const ch of s){let d=ch.choices[0]?.delta?.content||""; full+=d; bot.innerText=full; chatDiv.scrollTop=chatDiv.scrollHeight;}
    messages.push({role:"assistant",content:full});
  }catch(e){ bot.innerText="Model abhi load ho raha hai, 30 sec ruko phir bhejo..." }
}
document.getElementById('sendBtn').onclick=sendMsg;
inp.addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});
document.getElementById('fileBtn').onclick=()=>document.getElementById('fileIn').click();
document.getElementById('fileIn').onchange=e=>handleFile(e.target.files[0]);

async function handleFile(file){
  if(!file) return; add(`📎 ${file.name}`,'user'); status.innerText=`📖 Reading...`; let text="";
  try{
    if(file.type.includes("pdf")){
      const pdf=await pdfjsLib.getDocument(URL.createObjectURL(file)).promise;
      for(let i=1;i<=Math.min(pdf.numPages,5);i++){let p=await pdf.getPage(i); let c=await p.getTextContent(); text+=c.items.map(x=>x.str).join(" ")+" ";}
    }else if(file.type.includes("image")){
      const {data}=await Tesseract.recognize(file,'eng+hin'); text=data.text;
    }else{ text=await file.text(); }
    status.innerText="✅ Ready"; inp.value=`[FILE ${file.name}] ${text.slice(0,4000)} summary + MCQ banao`; sendMsg();
  }catch(e){ status.innerText="File error" }
}
document.getElementById('camBtn').onclick=async()=>{
  if(vid.style.display==='none'||!vid.style.display){
    vid.style.display='block'; let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}); vid.srcObject=s; vid._s=s;
  }else{
    can.width=vid.videoWidth; can.height=vid.videoHeight; can.getContext('2d').drawImage(vid,0,0); vid.style.display='none'; vid._s.getTracks().forEach(t=>t.stop());
    let b=await (await fetch(can.toDataURL())).blob(); handleFile(new File([b],"cam.jpg",{type:"image/jpeg"}));
  }
}
document.getElementById('mic').onclick=()=>{
  let r=new (window.SpeechRecognition||window.webkitSpeechRecognition)(); r.lang='hi-IN'; r.start();
  let m=document.getElementById('mic'); m.classList.add('recording');
  r.onresult=e=>{inp.value=e.results[0][0].transcript; sendMsg();};
  r.onend=()=>m.classList.remove('recording');
}
</script>
</body>
</html>
